[package]
name = "encoded_exfil_detection"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust implementation of encoded exfiltration detection plugin"

[lib]
proc-macro = false

[dependencies]
pyo3 = { version = "0.21", features = ["auto-initialize"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.13"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util", "macros"] }
