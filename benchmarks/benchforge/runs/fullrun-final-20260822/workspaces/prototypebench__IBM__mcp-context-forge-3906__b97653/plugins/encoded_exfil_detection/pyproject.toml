[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "encoded_exfil_detection"
version = "0.2.0"
description = "Encoded Exfiltration Detection Plugin for MCP"
authors = [{name = "IBM", email = "opensource@ibm.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["mcp", "security", "exfiltration", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/ibm/mcp-context-forge"
Repository = "https://github.com/ibm/mcp-context-forge"

[project.dependencies]
mcp = ">=0.1.0"
pydantic = ">=2.0.0"
typing-extensions = ">=4.0.0"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
