<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; font-family: sans-serif; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #2c2c2c; color: #fff; padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  #toolbar button {
    background: #4a90d9; color: #fff; border: none;
    padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  #toolbar button:hover { background: #357abd; }
  #container { display: flex; width: 100%; margin-top: 44px; }
  #entries-panel {
    width: 240px; min-width: 200px; background: #f5f5f5;
    border-right: 1px solid #ddd; overflow-y: auto;
    padding: 8px 0;
  }
  .entry.file {
    padding: 8px 16px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    border-left: 3px solid transparent;
  }
  .entry.file:hover { background: #e0e0e0; }
  .entry.file.active { background: #d0e4ff; border-left-color: #4a90d9; }
  #editor-area {
    flex: 1; display: flex; flex-direction: column;
    background: #fff;
  }
  #editor-title {
    padding: 8px 16px; background: #fafafa;
    border-bottom: 1px solid #eee; font-weight: bold; color: #333;
  }
  #editor-content {
    flex: 1; padding: 16px; font-family: 'Courier New', monospace;
    font-size: 14px; line-height: 1.6; outline: none; resize: none;
    border: none; width: 100%;
  }
  #editor-placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #aaa; font-size: 18px;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-file">File</button>
</div>

<div id="container">
  <div id="entries-panel"></div>
  <div id="editor-area">
    <div id="editor-title">No file selected</div>
    <textarea id="editor-content" readonly style="display:none;"></textarea>
    <div id="editor-placeholder">Select a file to view its content</div>
  </div>
</div>

<script>
(function() {
  var entriesPanel = document.getElementById('entries-panel');
  var btnFile = document.getElementById('btn-file');
  var editorContent = document.getElementById('editor-content');
  var editorTitle = document.getElementById('editor-title');
  var editorPlaceholder = document.getElementById('editor-placeholder');

  var fileIdCounter = 0;
  var activeEntry = null;

  // Random text generator
  function randomText(length) {
    length = length || (Math.floor(Math.random() * 200) + 50);
    var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';
    var result = '';
    for (var i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result.trim();
  }

  // Random filename generator
  function randomFilename() {
    var extensions = ['txt', 'js', 'css', 'html', 'json', 'md', 'py', 'xml'];
    var ext = extensions[Math.floor(Math.random() * extensions.length)];
    var words = ['doc', 'file', 'note', 'readme', 'config', 'data', 'sample', 'test', 'log', 'main'];
    var word = words[Math.floor(Math.random() * words.length)];
    return word + '.' + ext;
  }

  // Append a new file entry
  function appendFileEntry() {
    var id = 'file-' + (++fileIdCounter);
    var filename = randomFilename();
    var content = randomText();

    var entry = document.createElement('div');
    entry.className = 'entry file';
    entry.setAttribute('id', id);
    entry.setAttribute('data-content', content);
    entry.setAttribute('data-filename', filename);
    entry.textContent = filename;

    entry.addEventListener('click', function() {
      displayFile(id);
    });

    entriesPanel.appendChild(entry);
  }

  // Display a file's content in the editor
  function displayFile(id) {
    var entry = document.getElementById(id);
    if (!entry) return;

    // Remove previous active state
    if (activeEntry) {
      activeEntry.classList.remove('active');
    }
    activeEntry = entry;
    entry.classList.add('active');

    var filename = entry.getAttribute('data-filename');
    var content = entry.getAttribute('data-content');

    editorTitle.textContent = filename;
    editorContent.value = content;
    editorContent.style.display = 'block';
    editorPlaceholder.style.display = 'none';
  }

  // Button click handler
  btnFile.addEventListener('click', function() {
    appendFileEntry();
  });

})();
</script>

</body>
</html>
