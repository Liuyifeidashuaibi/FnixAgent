<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background: #16213e;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: right;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .display input {
      background: transparent;
      border: none;
      color: #e0e0f0;
      font-size: 1.8rem;
      text-align: right;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .buttons button {
      padding: 14px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .buttons button:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #1a1a2e;
      color: #e0e0f0;
    }
    .btn-number:hover { background: #2a2a4a; }

    .btn-operator {
      background: #4361ee;
      color: #fff;
    }
    .btn-operator:hover { background: #3a56d4; }

    .btn-clear {
      background: #e74c3c;
      color: #fff;
    }
    .btn-clear:hover { background: #c0392b; }

    .btn-sqrt {
      background: #f39c12;
      color: #fff;
    }
    .btn-sqrt:hover { background: #d68910; }

    .btn-equals {
      background: #2ecc71;
      color: #fff;
      grid-column: span 2;
    }
    .btn-equals:hover { background: #27ae60; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <input type="text" id="display" readonly>
    </div>
    <div class="buttons">
      <button class="btn-clear" id="clear">C</button>
      <button class="btn-sqrt" id="sqrt">√</button>
      <button class="btn-operator" data-value="%">%</button>
      <button class="btn-operator" data-value="/">÷</button>

      <button class="btn-number" data-value="7">7</button>
      <button class="btn-number" data-value="8">8</button>
      <button class="btn-number" data-value="9">9</button>
      <button class="btn-operator" data-value="*">×</button>

      <button class="btn-number" data-value="4">4</button>
      <button class="btn-number" data-value="5">5</button>
      <button class="btn-number" data-value="6">6</button>
      <button class="btn-operator" data-value="-">−</button>

      <button class="btn-number" data-value="1">1</button>
      <button class="btn-number" data-value="2">2</button>
      <button class="btn-number" data-value="3">3</button>
      <button class="btn-operator" data-value="+">+</button>

      <button class="btn-number" data-value="0">0</button>
      <button class="btn-number" data-value=".">.</button>
      <button class="btn-equals" id="equals">=</button>
    </div>
  </div>

  <script>
    (function () {
      const display = document.getElementById('display');
      const clearBtn = document.getElementById('clear');
      const sqrtBtn = document.getElementById('sqrt');
      const equalsBtn = document.getElementById('equals');

      // Number and operator buttons
      document.querySelectorAll('[data-value]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          display.value += btn.getAttribute('data-value');
        });
      });

      // Clear button
      clearBtn.addEventListener('click', function () {
        display.value = '';
      });

      // Sqrt button — calculate sqrt of current display content directly
      sqrtBtn.addEventListener('click', function () {
        var content = display.value.trim();
        if (content === '') return;
        try {
          var num = parseFloat(content);
          if (isNaN(num) || num < 0) {
            display.value = 'Error';
          } else {
            display.value = Math.sqrt(num);
          }
        } catch (e) {
          display.value = 'Error';
        }
      });

      // Equals button — evaluate the expression
      equalsBtn.addEventListener('click', function () {
        var expr = display.value;
        if (expr === '') return;
        try {
          var result = Function('"use strict"; return (' + expr + ')')();
          display.value = result;
        } catch (e) {
          display.value = 'Error';
        }
      });
    })();
  </script>
</body>
</html>
