<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Browser</title>
  <style>
    body { margin: 0; font-family: sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

    body.dark { background-color: #1a1a1a; color: #e0e0e0; }
    body.light { background-color: #ffffff; color: #333333; }

    .toolbar { padding: 10px; border-bottom: 1px solid #444; transition: background-color 0.3s ease, border-color 0.3s ease; }
    body.dark .toolbar { background: #2a2a2a; border-bottom-color: #444; }
    body.light .toolbar { background: #f0f0f0; border-bottom-color: #ccc; }

    .toolbar label { margin-right: 8px; font-weight: bold; }
    iframe { width: 100%; height: calc(100vh - 50px); border: none; }

    .theme {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      cursor: pointer;
      font-size: 14px;
    }
    body.dark .theme { background: #1a1a1a; color: #e0e0e0; border-color: #444; }
    body.light .theme { background: #ffffff; color: #333333; border-color: #ccc; }
  </style>
</head>
<body class="dark">
  <div class="toolbar">
    <label for="address">Address:</label>
    <select id="address">
      <option value="doc/getting-started.html" selected>doc/getting-started.html</option>
    </select>

    <label for="theme-select">Theme:</label>
    <select class="theme" id="theme-select">
      <option value="dark" selected>Dark</option>
      <option value="light">Light</option>
    </select>
  </div>
  <iframe id="content" src="doc/getting-started.html"></iframe>

  <script>
    const addressSelect = document.getElementById('address');
    const themeSelect = document.getElementById('theme-select');
    const iframe = document.getElementById('content');

    // Load saved theme or default to dark
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.className = savedTheme;
    themeSelect.value = savedTheme;

    function updateIframeSrc() {
      const baseUrl = addressSelect.value;
      const theme = themeSelect.value;
      iframe.src = baseUrl + '?theme=' + theme;
    }

    // Set initial iframe src with theme param
    updateIframeSrc();

    addressSelect.addEventListener('change', function() {
      updateIframeSrc();
    });

    themeSelect.addEventListener('change', function() {
      const theme = this.value;
      document.body.className = theme;
      localStorage.setItem('theme', theme);
      updateIframeSrc();
    });
  </script>
</body>
</html>
