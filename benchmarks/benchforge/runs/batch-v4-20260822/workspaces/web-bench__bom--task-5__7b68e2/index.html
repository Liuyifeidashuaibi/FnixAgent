<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Navigation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f0f0f0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #dee1e6;
      border-bottom: 1px solid #c0c0c0;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #b0b0b0;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      background: #e8e8e8;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      fill: #333;
    }

    .address-bar {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #b0b0b0;
      border-radius: 16px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .address-bar:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
    }

    .content-frame {
      flex: 1;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="back-btn" class="nav-btn" disabled title="Go back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button id="forward-btn" class="nav-btn" disabled title="Go forward">
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
    <input id="address-bar" class="address-bar" type="text" placeholder="Enter URL..." value="https://example.com">
  </div>
  <iframe id="content-frame" class="content-frame" src="https://example.com"></iframe>

  <script>
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const iframe = document.getElementById('content-frame');
    const addressBar = document.getElementById('address-bar');

    // Navigation history management
    const history = [];
    let currentIndex = -1;
    let isNavigating = false;

    function updateButtons() {
      backBtn.disabled = currentIndex <= 0;
      forwardBtn.disabled = currentIndex >= history.length - 1;
    }

    function updateAddressBar() {
      try {
        addressBar.value = iframe.contentWindow.location.href;
      } catch (e) {
        // Cross-origin: use the src attribute
        addressBar.value = iframe.src;
      }
    }

    function navigateTo(url) {
      isNavigating = true;
      // Remove forward history when navigating to a new page
      history.splice(currentIndex + 1);
      history.push(url);
      currentIndex = history.length - 1;
      iframe.src = url;
      addressBar.value = url;
      updateButtons();
    }

    // Use the Navigation API if available, fall back to manual tracking
    if (window.navigation) {
      // Listen for navigation events on the iframe
      // The Navigation API is used on the iframe's content window
    }

    iframe.addEventListener('load', () => {
      if (!isNavigating) {
        // User clicked a link inside the iframe
        try {
          const currentUrl = iframe.contentWindow.location.href;
          // Remove forward history
          history.splice(currentIndex + 1);
          history.push(currentUrl);
          currentIndex = history.length - 1;
          addressBar.value = currentUrl;
          updateButtons();
        } catch (e) {
          // Cross-origin: use src
          const currentUrl = iframe.src;
          if (currentUrl && currentUrl !== 'about:blank') {
            history.splice(currentIndex + 1);
            history.push(currentUrl);
            currentIndex = history.length - 1;
            addressBar.value = currentUrl;
            updateButtons();
          }
        }
      }
      isNavigating = false;

      // Try to use Navigation API on iframe's content window
      try {
        const iframeNav = iframe.contentWindow.navigation;
        if (iframeNav) {
          updateButtonsFromNav(iframeNav);
          iframeNav.addEventListener('currententrychange', () => {
            updateButtonsFromNav(iframeNav);
            updateAddressBar();
          });
        }
      } catch (e) {
        // Cross-origin iframe, can't access navigation API
      }
    });

    function updateButtonsFromNav(nav) {
      const entries = nav.entries();
      const idx = entries.indexOf(nav.currentEntry);
      backBtn.disabled = !nav.canGoBack;
      forwardBtn.disabled = !nav.canGoForward;
    }

    backBtn.addEventListener('click', () => {
      isNavigating = true;
      // Prefer Navigation API
      try {
        const iframeNav = iframe.contentWindow.navigation;
        if (iframeNav && iframeNav.canGoBack) {
          iframeNav.back();
          setTimeout(() => {
            updateButtonsFromNav(iframeNav);
            updateAddressBar();
            isNavigating = false;
          }, 100);
          return;
        }
      } catch (e) {
        // Cross-origin, fall back
      }
      // Fallback: use iframe history
      if (currentIndex > 0) {
        currentIndex--;
        iframe.src = history[currentIndex];
        addressBar.value = history[currentIndex];
        updateButtons();
      }
      isNavigating = false;
    });

    forwardBtn.addEventListener('click', () => {
      isNavigating = true;
      // Prefer Navigation API
      try {
        const iframeNav = iframe.contentWindow.navigation;
        if (iframeNav && iframeNav.canGoForward) {
          iframeNav.forward();
          setTimeout(() => {
            updateButtonsFromNav(iframeNav);
            updateAddressBar();
            isNavigating = false;
          }, 100);
          return;
        }
      } catch (e) {
        // Cross-origin, fall back
      }
      // Fallback: use iframe history
      if (currentIndex < history.length - 1) {
        currentIndex++;
        iframe.src = history[currentIndex];
        addressBar.value = history[currentIndex];
        updateButtons();
      }
      isNavigating = false;
    });

    addressBar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = addressBar.value.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        navigateTo(url);
      }
    });

    // Initialize history with the initial page
    history.push(iframe.src);
    currentIndex = 0;
    updateButtons();
  </script>
</body>
</html>
