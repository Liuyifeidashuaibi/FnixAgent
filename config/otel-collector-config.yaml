# ====================================================================
# OpenTelemetry Collector 配置(OfficeAgent 统一观测管道)
# ====================================================================
# 2026 标准:CNCF 毕业,GenAI Semantic Conventions 统一 LLM span
# 所有观测后端(Langfuse/Phoenix/Jaeger)通过此管道统一接入
# ====================================================================

receivers:
  # OTLP 接收(gRPC + HTTP)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 批处理
  batch:
    timeout: 5s
    send_batch_size: 1024

  # 内存限制
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # PII 脱敏(2026 安全要求)
  # 参考: https://maketocreate.com/opentelemetry-genai-tracing-ai-agents-without-leaking-pii/
  redaction:
    allow_all_keys: false
    allowed_keys:
      - gen_ai.system
      - gen_ai.operation.name
      - gen_ai.request.model
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.response.finish_reason
      - gen_ai.prompt
      - gen_ai.completion
    blocked_values:
      - "(?i)password.*"
      - "(?i)api[_-]?key.*"
      - "(?i)token.*"
      - "(?i)secret.*"
      # 身份证/手机号/邮箱等 PII
      - "\\d{15,18}"           # 身份证
      - "1[3-9]\\d{9}"         # 手机号
      - "[\\w.-]+@[\\w.-]+\\.\\w+"  # 邮箱

  # GenAI Semantic Conventions 属性注入
  attributes/genai:
    actions:
      - key: officeagent.component
        action: upsert
        from_attribute: gen_ai.system
      - key: officeagent.tier
        action: upsert
        value: production

exporters:
  # Phoenix(Agent 工作流评估)
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true

  # Langfuse(全链路追踪 + Prompt 管理)
  otlp/langfuse:
    endpoint: langfuse:3000
    tls:
      insecure: true

  # 日志(调试)
  debug:
    verbosity: basic

  # Prometheus 指标(可选)
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    # Traces 管道
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, attributes/genai, batch]
      exporters:
        - otlp/phoenix
        - otlp/langfuse
        - debug

    # Metrics 管道
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters:
        - prometheus
        - debug

    # Logs 管道
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters:
        - debug

  # 扩展(GenAI 语义约定)
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
