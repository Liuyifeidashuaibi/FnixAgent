---
apiVersion: v1
kind: Service
metadata:
  name: fnixagent-agentd
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7891
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
  publishNotReadyAddresses: false
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Headless service for service mesh
apiVersion: v1
kind: Service
metadata:
  name: fnixagent-agentd-headless
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
spec:
  clusterIP: None
  ports:
    - name: http
      port: 7891
      targetPort: http
  selector:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd