---
# FnixAgent agentd Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fnixagent-agentd
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/part-of: fnixagent
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fnixagent
      app.kubernetes.io/component: agentd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fnixagent
        app.kubernetes.io/component: agentd
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: '/metrics'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentd
          image: ghcr.io/fnixagent/agentd:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: FNIX_LOG_LEVEL
              value: 'info'
            - name: FNIX_LANG
              value: 'zh-CN'
            - name: FNIX_PORT
              value: '8000'
          envFrom:
            - secretRef:
                name: fnixagent-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
            ephemeral-storage: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/fnixagent/.fnix
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/fnixagent/.cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fnixagent-data
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fnixagent
                    app.kubernetes.io/component: agentd
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fnixagent
              app.kubernetes.io/component: agentd
