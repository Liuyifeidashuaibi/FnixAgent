---
# PodDisruptionBudget - 保证维护时不全部中断
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fnixagent-agentd
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fnixagent
      app.kubernetes.io/component: agentd
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fnixagent-agentd
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
    app.kubernetes.io/component: agentd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fnixagent-agentd
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
# NetworkPolicy - 默认拒绝,只允许必要流量
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fnixagent-agentd
  namespace: fnixagent
  labels:
    app.kubernetes.io/name: fnixagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fnixagent
      app.kubernetes.io/component: agentd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: fnixagent
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 7891
        - protocol: TCP
          port: 9090
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # LLM providers (HTTPS)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # NTP
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 123