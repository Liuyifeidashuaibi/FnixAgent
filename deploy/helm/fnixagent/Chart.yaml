apiVersion: v2
name: fnixagent
description: |
  fnixagent — AI 原生办公工作站 Helm Chart。
  部署 fnixagent API 服务及其依赖(PostgreSQL/Redis/Milvus/MinIO/Elasticsearch)。
  生产环境建议使用云托管数据库,仅部署 fnixagent 本身 + Ingress。
type: application
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/Liuyifeidashuaibi/FnixAgent
maintainers:
  - name: fnixagent Team
    email: liuyifeidashuaibi@gmail.com
keywords:
  - fnixagent
  - ai
  - agent
  - llm
  - productivity

# 子 Chart 依赖(默认禁用,生产环境推荐使用云托管数据库)
# 启用方式:在 values.yaml 中设置 postgres.enabled: true / redis.enabled: true
dependencies:
  - name: postgresql
    version: "15.5.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgres.enabled
    alias: postgres
  - name: redis
    version: "20.0.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    alias: redis
