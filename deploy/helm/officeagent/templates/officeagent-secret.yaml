{{/*
OfficeAgent Secret

生产环境推荐使用以下方式之一替代此模板:
  1. Sealed Secrets(kubeseal 加密后可提交到 Git)
  2. External Secrets Operator(对接 AWS Secrets Manager / 阿里云 KMS / Vault)
  3. helm install --set secret.values.JWT_SECRET_KEY=xxx(命令行注入)

此模板仅在 secret.create=true 时创建,且仅适用于开发环境。
生产环境必须设置 secret.create=false,通过外部方式注入同名 Secret。

Sealed Secrets 示例:
  echo -n 'your-strong-password' | kubectl create secret generic officeagent-secrets \
    --dry-run=client --from-file=POSTGRES_PASSWORD=/dev/stdin -o yaml | \
    kubeseal --format yaml > officeagent-sealed.yaml
  kubectl apply -f officeagent-sealed.yaml
*/}}
{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "officeagent.secretName" . }}
  labels:
    {{- include "officeagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
