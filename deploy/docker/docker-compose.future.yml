# ====================================================================
# OfficeAgent Durable Execution + Edge Compute 编排(2026 未来版)
# ====================================================================
# 用途:在 docker-compose.gpu.yml 基础上,叠加未来趋势组件:
#       - Restate Durable Execution(长时 Agent 工作流不崩溃)
#       - gVisor/Firecracker 沙箱(不信任代码隔离)
#       - WebLLM/MLC-LLM 边缘推理(前端零服务器)
#       - Brave Search API MCP(Agent 搜索)
#       - Phoenix/Ragas 评估(OTel 兼容)
#
# 启动方式:
#   docker compose -f docker-compose.yml \
#                  -f deploy/docker/docker-compose.gpu.yml \
#                  -f deploy/docker/docker-compose.future.yml \
#                  --profile durable --profile edge --profile eval up -d
# ====================================================================

services:
  # ==================================================================
  # Durable Execution:Restate(嵌入进程式持久化执行)
  # ==================================================================
  # 仓库: https://github.com/restatedev/restate
  # 2026 关键能力:
  #   - Journal-Based Replay:崩溃后从最后完成步骤恢复,不重算
  #   - 嵌入 Agent 进程,无需独立集群(比 Temporal 轻)
  #   - 长时工作流(周/月级) durable state
  #   - 解决"Agent 第 15 分钟崩溃"问题
  # 集成方式:
  #   agent-runner 用 Restate SDK 装饰长任务函数
  #   替代部分 Celery 长任务(批量真题生成/PDF 解析)
  # ------------------------------------------------------------------
  restate:
    image: registry.docker.com/restatedev/restate:latest
    container_name: officeagent-restate
    profiles: ["durable"]
    environment:
      # Restate 监听
      RESTATE_BIND: "0.0.0.0:8080"
      RESTATE_META_BIND: "0.0.0.0:9070"
      # 持久化(复用 Postgres)
      RESTATE_STORAGE: postgres
      RESTATE_POSTGRES_URL: postgresql://officeagent:${POSTGRES_PASSWORD:-officeagent-dev}@postgres:5432/officeagent_restate
      # 工作线程
      RESTATE_WORKER_THREADS: ${RESTATE_WORKERS:-4}
    ports:
      - "18090:8080"  # API
      - "19070:9070"  # Meta
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9070/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================================================================
  # DBOS(Durable Execution,Postgres 原生)
  # ==================================================================
  # 仓库: https://github.com/dbos-inc/dbos-transact
  # 2026 关键能力:
  #   - 直接用 Postgres 作为持久化层(无需独立集群)
  #   - 比 Temporal 轻,适合中小规模
  #   - Python/TypeScript SDK
  # 定位:Restate 的备选,二选一
  # ------------------------------------------------------------------
  # dbos:
  #   image: dbosinc/dbos-transact:latest
  #   container_name: officeagent-dbos
  #   profiles: ["durable"]
  #   environment:
  #     DBOS_DATABASE: postgresql://officeagent:${POSTGRES_PASSWORD:-officeagent-dev}@postgres:5432/officeagent_dbos
  #   ports:
  #     - "18091:8080"

  # ==================================================================
  # 安全沙箱:gVisor(runsc runtime)
  # ==================================================================
  # 仓库: https://gvisor.dev/
  # 2026 关键能力:
  #   - 用户态 Linux 内核,拦截所有 syscall
  #   - 无需独立 VM,容器级隔离
  #   - 适合执行半信任代码
  # 启用方式:
  #   1. 宿主机安装 runsc: https://gvisor.dev/docs/user_guide/install/
  #   2. /etc/docker/daemon.json 注册 runsc runtime
  #   3. 此服务用 runtime: runsc
  # ------------------------------------------------------------------
  sandbox-gvisor:
    image: python:3.11-slim
    container_name: officeagent-sandbox-gvisor
    profiles: ["sandbox"]
    runtime: runsc  # 需要宿主机安装 gVisor
    environment:
      SANDBOX_MODE: gvisor
      SANDBOX_MAX_MEMORY: 1G
      SANDBOX_MAX_CPU: "2.0"
      SANDBOX_TIMEOUT: 300
    volumes:
      - sandbox_workspace:/workspace
    command: ["sleep", "infinity"]  # 由 tool-executor 调用
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # ==================================================================
  # 安全沙箱:Firecracker microVM(最高隔离)
  # ==================================================================
  # 仓库: https://github.com/firecracker-microvm/firecracker
  # 2026 关键能力:
  #   - 独立内核,最高隔离级别
  #   - ~125ms 启动,极轻量
  #   - AWS Lambda/Fargate 底层技术
  #   - 适合执行完全不信任代码
  # 启用方式:需要宿主机支持 KVM(Linux GPU 服务器)
  # ------------------------------------------------------------------
  # 通过 firecracker-containerd 集成,此处仅占位
  # 实际部署:https://github.com/firecracker-microvm/firecracker-containerd

  # ==================================================================
  # 评估层:Arize Phoenix(OTel 兼容,Agent 工作流评估)
  # ==================================================================
  # 仓库: https://github.com/Arize-ai/phoenix
  # 2026 关键能力:
  #   - 开源 LLM 可观测 + 评估一体化
  #   - 原生支持 OTel GenAI Semantic Conventions
  #   - Agent 工作流 step-level 评估专长
  #   - 与 Langfuse 互补:Langfuse 追踪,Phoenix 评估
  # ------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: officeagent-phoenix
    profiles: ["eval"]
    environment:
      # PHOENIX_PORT: 6000
      # PHOENIX_HOST: 0.0.0.0
      # OTel 接收端口
      PHOENIX_OTLP_HTTP_PORT: 4317
      PHOENIX_OTLP_GRPC_PORT: 4318
      # 持久化(本地 SQLite,生产可换 Postgres)
      PHOENIX_SQL_DATABASE_URL: sqlite:///phoenix.db
    ports:
      - "16000:6000"      # UI
      - "14317:4317"      # OTel gRPC
      - "14318:4318"      # OTel HTTP
    restart: unless-stopped

  # ==================================================================
  # OTel Collector(统一观测管道)
  # ==================================================================
  # 2026 关键能力:
  #   - CNCF 毕业,统一 traces/metrics/logs/profiles
  #   - GenAI Semantic Conventions 标准化 LLM span
  #   - 所有观测后端(Langfuse/Phoenix/Jaeger)统一接入
  # ------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: officeagent-otel-collector
    profiles: ["eval"]
    environment:
      # 接收 OTLP
      OTLP_RECEIVER: "true"
    volumes:
      - ../../config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "14317:4317"  # OTLP gRPC
      - "14318:4318"  # OTLP HTTP
    depends_on:
      - phoenix
    restart: unless-stopped

  # ==================================================================
  # 搜索 MCP:Brave Search API(Agent 搜索,准确度第一)
  # ==================================================================
  # 仓库: https://github.com/modelcontextprotocol/servers/tree/main/src/brave-search
  # 2026 关键能力:
  #   - Agentic Search benchmark 14.89 分第一
  #   - 独立索引,不依赖 Google/Bing
  #   - 官方 MCP server,无缝接入
  # 集成方式:
  #   agent-runner 的 core/mcp/ 调用此 MCP server
  # ------------------------------------------------------------------
  brave-search-mcp:
    image: mcp/brave-search:latest
    container_name: officeagent-brave-search-mcp
    profiles: ["search"]
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      BRAVE_MCP_PORT: 8000
    ports:
      - "18092:8000"
    restart: unless-stopped

  # ==================================================================
  # 搜索 MCP:Tavily(默认 Agent 搜索层)
  # ==================================================================
  # 仓库: https://github.com/tavily-ai/tavily-mcp
  # 2026 关键能力:
  #   - 专为 Agent 设计,返回清洗后内容 + 引用
  #   - 官方 MCP server + LangChain/LlamaIndex 原生集成
  #   - Search + Extract + Crawl + Map 全套
  # ------------------------------------------------------------------
  tavily-mcp:
    image: mcp/tavily:latest
    container_name: officeagent-tavily-mcp
    profiles: ["search"]
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MCP_PORT: 8000
    ports:
      - "18093:8000"
    restart: unless-stopped

  # ==================================================================
  # 边缘推理:WebLLM 服务(前端 WebGPU 推理支持)
  # ==================================================================
  # 仓库: https://github.com/mlc-ai/web-llm
  # 2026 关键能力:
  #   - WebGPU 浏览器内推理,零服务器
  #   - v0.2.83(2026-04),OpenAI API 兼容
  #   - 前端小任务(意图分类/简单问答)无需调用后端
  # 定位:
  #   此服务仅提供模型文件 CDN,实际推理在用户浏览器
  #   前端集成 @mlc-ai/web-llm npm 包
  # ------------------------------------------------------------------
  webllm-cdn:
    image: nginx:alpine
    container_name: officeagent-webllm-cdn
    profiles: ["edge"]
    volumes:
      - webllm_models:/usr/share/nginx/html/models:ro
      - ../../config/webllm-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18094:80"
    restart: unless-stopped

volumes:
  sandbox_workspace:
  webllm_models:
