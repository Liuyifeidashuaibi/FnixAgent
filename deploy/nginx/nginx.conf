# OfficeAgent nginx 主配置
# 部署位置: /etc/nginx/nginx.conf
# 由 deploy/docker/docker-compose.prod.yml 挂载

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---------------------------------------------------------------------------
    # 基础设置
    # ---------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;                    # 隐藏 nginx 版本号

    # 日志格式(生产可接入 ELK)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # 性能优化
    # ---------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # 客户端请求体限制(支持文件上传,与后端 50MB 限制对齐)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-yaml
        image/svg+xml;

    # 缓冲区
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # ---------------------------------------------------------------------------
    # 缓存与限流
    # ---------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # 限流区:API 每秒 10 个请求/IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 限流区:登录接口每秒 1 个请求/IP(防爆破)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    # ---------------------------------------------------------------------------
    # SSL 优化(TLS 1.3)
    # ---------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 上游服务(蜂巢化 P2-7:4 个独立服务)
    upstream doc_parser_backend {
        server doc-parser:8001;
        keepalive 16;
    }

    upstream knowledge_backend {
        server knowledge:8002;
        keepalive 16;
    }

    upstream agent_runner_backend {
        server agent-runner:8003;
        keepalive 32;
    }

    upstream tool_executor_backend {
        server tool-executor:8004;
        keepalive 16;
    }

    # 包含站点配置
    include /etc/nginx/conf.d/*.conf;
}
