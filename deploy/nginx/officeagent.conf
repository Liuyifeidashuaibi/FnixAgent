# OfficeAgent 站点配置(蜂巢化 P2-7)
# 部署位置: /etc/nginx/conf.d/officeagent.conf
#
# 功能:
#   1. HTTP → HTTPS 重定向
#   2. HTTPS 反向代理,按路径路由到 4 个蜂巢服务:
#      - /api/v1/documents/*  → doc-parser    (文档上传/解析)
#      - /api/v1/knowledge/*  → knowledge      (知识检索)
#      - /api/v1/chat/*       → agent-runner   (对话/推理)
#      - /api/v1/tools/*      → tool-executor  (工具执行)
#      - 其余 /api/*          → agent-runner   (默认后端)
#   3. 静态资源缓存
#   4. SSE 流式接口支持(不缓冲)
#   5. 安全响应头(HSTS / X-Frame-Options / CSP 等)
#   6. 限流:API 10r/s,登录 1r/s

# ---------------------------------------------------------------------------
# HTTP → HTTPS 重定向
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge 路径(Let's Encrypt 续签用)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS 主站点
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL 证书(开发用自签,生产用 Let's Encrypt 或商业证书)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---------------------------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP(严格策略,生产环境需根据前端实际加载的资源调整)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    # ---------------------------------------------------------------------------
    # 蜂巢化 API 反向代理(按路径路由到 4 个服务)
    # ---------------------------------------------------------------------------

    # 文档上传/解析 → doc-parser
    location /api/v1/documents/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://doc_parser_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文档解析耗时较长,放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 知识检索 → knowledge
    location /api/v1/knowledge/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://knowledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 工具执行 → tool-executor
    location /api/v1/tools/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://tool_executor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 工具执行(OO/转换)可能耗时
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 流式接口(SSE/WebSocket)→ agent-runner,关闭缓冲,长连接
    location ~ ^/api/v1/(chat/stream|chat/evolve)$ {
        proxy_pass http://agent_runner_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关闭缓冲,SSE 必须实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;          # 长连接 10 分钟
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 登录鉴权接口(严格限流防爆破)→ agent-runner
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://agent_runner_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API(对话/任务/管理)→ agent-runner(默认后端)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://agent_runner_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # 健康检查(不限流)→ agent-runner
    # ---------------------------------------------------------------------------
    location = /health {
        proxy_pass http://agent_runner_backend/health;
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # OpenAPI 文档(生产可关闭)→ agent-runner
    # ---------------------------------------------------------------------------
    location /docs {
        proxy_pass http://agent_runner_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://agent_runner_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ---------------------------------------------------------------------------
    # 静态资源(前端 SPA,Phase 1 起接入)
    # ---------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存(带 hash 的文件 1 年)
        location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML 短缓存
        location = /index.html {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ---------------------------------------------------------------------------
    # 错误页
    # ---------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
