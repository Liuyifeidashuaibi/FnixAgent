# Alembic configuration (Phase 0.3 database migrations)
#
# Usage:
#   alembic upgrade head       # apply all migrations
#   alembic downgrade -1       # rollback one revision
#   alembic revision -m "msg"  # create empty migration
#   alembic revision --autogenerate -m "msg"  # autodetect model changes
#
# Database connection string priority:
#   1. Environment variable DATABASE_URL (recommended for docker/k8s)
#   2. sqlalchemy.url here (development default)

[alembic]
# Script location (relative to project root)
script_location = migrations

# Timezone for revision timestamps
timezone = UTC

# Revision file naming: {rev}_{slug}.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Version table name (default: alembic_version)
version_table = alembic_version

# Default connection string (development; production: override via DATABASE_URL env var)
# Format: postgresql+psycopg2://<user>:<password>@<host>:<port>/<dbname>
sqlalchemy.url = postgresql+psycopg2://fnixagent:fnixagent@localhost:5432/fnixagent

# Output encoding for offline SQL generation
# output_encoding = utf-8

[post_write_hooks]
# Auto-format new migrations with black after creation
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
