version: '3.8'

# OfficeAgent 开发环境编排
# 启动: docker compose up -d
# 销毁: docker compose down -v

services:
  # -----------------------------------------------------------------------
  # PostgreSQL 数据库
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: officeagent-postgres
    environment:
      POSTGRES_DB: officeagent
      POSTGRES_USER: officeagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-officeagent-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Redis 缓存(用于 Token 黑名单 / 设备指纹 / 限流)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: officeagent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-officeagent-dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-officeagent-dev}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # etcd(Milvus 依赖,必须先于 milvus 启动)
  # -----------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: officeagent-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcd", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # MinIO 文件存储(Milvus 依赖,亦用于业务文件存储)
  # -----------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: officeagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-officeagent}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-officeagent-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Milvus 向量数据库(依赖 etcd + minio)
  # -----------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: officeagent-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"  # Milvus metrics
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Elasticsearch 搜索引擎
  # -----------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: officeagent-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # OfficeAgent 应用
  # -----------------------------------------------------------------------
  officeagent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: officeagent-app
    environment:
      DATABASE_URL: postgresql://officeagent:${POSTGRES_PASSWORD:-officeagent-dev}@postgres:5432/officeagent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-officeagent-dev}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-officeagent}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-officeagent-dev}
      ES_HOST: elasticsearch
      ES_PORT: 9200
      GLM_API_KEY: ${GLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-officeagent-dev-secret-change-me}
      OFFICEAGENT_MODE: ${OFFICEAGENT_MODE:-legacy}
      SERVICE_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./assets:/app/assets        # 自进化资产目录(topology/traces/snapshots)
      - app_logs:/app/logs
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  milvus_data:
  minio_data:
  es_data:
  app_logs:
