[package]
name = "fnix-local"
version = "0.1.0"
edition = "2021"
description = "Fnix local sidecar — OpenAPI fnix-local-v1"

[[bin]]
name = "fnix-local"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
