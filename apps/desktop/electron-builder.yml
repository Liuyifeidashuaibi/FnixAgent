# fnixagent Electron 桌面客户端打包配置
# Phase 1.9: Win nsis + macOS dmg + 代码签名 + 自动更新
# Phase 2.6: 全平台(Win + macOS + Linux AppImage/deb/rpm)+ 代码签名架构
#
# 用法:
#   pnpm --filter @fnixagent/desktop build:win      # 打包 Windows nsis
#   pnpm --filter @fnixagent/desktop build:mac      # 打包 macOS dmg
#   pnpm --filter @fnixagent/desktop build:linux    # 打包 Linux AppImage+deb+rpm
#   pnpm --filter @fnixagent/desktop build:all      # 打包全部平台
#   pnpm --filter @fnixagent/desktop publish        # 打包并发布到 GitHub Releases
#
# 代码签名环境变量(不设置则产物未签名,开发环境可用):
#   Windows EV 证书:
#     CSC_LINK              Windows pfx 证书(base64 编码)
#     CSC_KEY_PASSWORD      Windows 证书密码
#   macOS Developer ID + Notarization:
#     CSC_LINK              macOS p12 证书(base64 编码)
#     CSC_KEY_PASSWORD      macOS 证书密码
#     CSC_NAME              macOS Developer ID Application 证书名(如 "Developer ID Application: ...")
#     APPLE_ID              Apple ID 邮箱(用于 Notarization)
#     APPLE_APP_SPECIFIC_PASSWORD  Apple 应用专用密码(app-specific password)
#     APPLE_TEAM_ID         Apple Team ID(10 位字母数字)
#   Linux:
#     无需代码签名(Linux 桌面生态无强制签名要求)
#     可选:GPG 签名通过 signPackages=true + 环境变量 GPKey 配置(本文档暂不启用)

appId: com.fnixagent.desktop
productName: fnixagent
copyright: Copyright © 2026 fnixagent Team

# 入口(由 electron-vite build 产出)
directories:
  output: release/${version}
  buildResources: buildResources
  app: .

# 构建文件(来自 electron-vite build 的 dist/)
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  - "!**/.vscode/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md}"
  - "!**/node_modules/*/{test,__tests__,tests}/**"

# 额外资源(可执行文件旁的资源)
extraResources:
  - from: ../../config
    to: config
    filter: ["**/*.yaml", "!**/secrets.yaml"]

# Windows 打包(nsis 安装器)
win:
  target:
    - target: nsis
      arch: [x64]
  # 代码签名:从环境变量读取(本地开发可不设置,产物未签名)
  # CI 中通过 CSC_LINK (base64 pfx) + CSC_KEY_PASSWORD 注入
  certificateFile: ${CSC_LINK}
  certificatePassword: ${CSC_KEY_PASSWORD}
  # 签名时间戳服务器(RFC 3161)
  rfc3161TimeStampServer: http://timestamp.digicert.com
  icon: buildResources/icon.ico

nsis:
  oneClick: false                # 非一键安装,允许选择目录
  perMachine: false              # 当前用户安装(无需管理员权限)
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: fnixagent
  # 安装包文件名
  artifactName: fnixagent-Setup-${version}.${ext}

# macOS 打包(dmg)
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  # 代码签名:Developer ID Application 证书
  # CI 中通过 CSC_LINK (base64 p12) + CSC_KEY_PASSWORD 注入
  identity: ${CSC_NAME}
  # Notarization(公证):Apple ID 凭据从环境变量读取
  notarize:
    teamId: ${APPLE_TEAM_ID}
  # hardened runtime + entitlements
  hardenedRuntime: true
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  icon: buildResources/icon.icns

dmg:
  title: fnixagent ${version}
  artifactName: fnixagent-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux 打包(Phase 2.6:AppImage + deb + rpm 三种格式)
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  category: Office
  icon: buildResources/icon.png
  # 桌面集成(.desktop 文件元数据)
  maintainer: fnixagent Team <dev@fnixagent.com>
  vendor: fnixagent
  synopsis: AI-native office workstation
  description: |
    fnixagent 是一款 AI 原生的办公工作站,集成文档编辑、智能对话、
    自进化 Agent、知识拓扑等能力,支持私有化部署。
  # 文件关联(可选,关联 .md/.txt/.yaml 文件)
  mimeTypes:
    - text/markdown
    - text/plain
    - application/yaml
  # AppImage 元数据(运行时集成)
  appImage:
    artifactName: fnixagent-${version}-${arch}.${ext}
  # deb 包元数据
  deb:
    depends:
      - libnotify4
      - libxtst6
      - libnss3
    artifactName: fnixagent-${version}-${arch}.${ext}
  # rpm 包元数据
  rpm:
    depends:
      - libnotify
      - libXtst
      - nss
    artifactName: fnixagent-${version}-${arch}.${ext}

# 自动更新:发布到 GitHub Releases
# electron-updater 运行时从 latest.yml / latest-mac.yml 检查更新
publish:
  - provider: github
    owner: fnixagent
    repo: fnixagent
    releaseType: release
  # 备用 CDN(可选,自建静态资源服务器)
  - provider: generic
    url: https://cdn.fnixagent.com/releases/${version}/
    channel: latest

# 压缩
compression: maximum

# 生成更新元数据(必需,electron-updater 依赖)
generateUpdatesFilesForAllChannels: true
