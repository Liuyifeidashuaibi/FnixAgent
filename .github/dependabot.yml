version: 2
updates:
  # Python dependencies (pip/uv)
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
    reviewers:
      - 'Liuyifeidashuaibi'
    assignees:
      - 'Liuyifeidashuaibi'
    groups:
      python-dev:
        patterns:
          - 'pytest*'
          - 'ruff'
          - 'mypy'
          - 'pytest-cov'
        update-types:
          - 'minor'
          - 'patch'

  # npm dependencies (pnpm workspace)
  - package-ecosystem: 'npm'
    directory: '/apps/workbench'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    reviewers:
      - 'Liuyifeidashuaibi'
    groups:
      react-ecosystem:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
        update-types:
          - 'minor'
          - 'patch'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'ci'
    reviewers:
      - 'Liuyifeidashuaibi'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Docker base images
  - package-ecosystem: 'docker'
    directory: '/deploy/docker'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'docker'
    reviewers:
      - 'Liuyifeidashuaibi'
