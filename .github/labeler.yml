# PR Labeler config
# https://github.com/actions/labeler#configuration

# --- Areas ---
workbench:
  - apps/workbench/**
  - apps/desktop-tauri/**
agentd:
  - src/fnixagent/**
  - apps/fnix-local/**
mcp:
  - src/fnixagent/core/mcp/**
  - src/fnixagent/mcp_server.py
docs:
  - docs/**
  - '**/*.md'
  - '!**/CHANGELOG.md'
  - '!**/node_modules/**'
ci:
  - .github/**
  - .github/workflows/**
  - .github/ISSUE_TEMPLATE/**
  - .github/PULL_REQUEST_TEMPLATE**
deploy:
  - deploy/**
  - docker-compose*.yml
  - Dockerfile
  - .dockerignore
  - '**/Dockerfile'
security:
  - src/fnixagent/core/security/**
  - SECURITY.md
  - .gitleaks.toml
schemas:
  - openapi.json
  - packages/protocol/**

# --- Kinds ---
feature:
  - '!**/*.test.*'
  - '!**/*.spec.*'
fix:
  - '!**/*.test.*'
  - '!**/*.spec.*'
docs:
  - '**/*.md'
ci:
  - .github/**
dependencies:
  - package.json
  - pnpm-lock.yaml
  - requirements.txt
  - pyproject.toml
tests:
  - '**/*.test.*'
  - '**/*.spec.*'
  - tests/**
  - e2e/**
  - __tests__/**

# --- Sizes (large PRs are reviewed more carefully) ---
size/XS:
  - changes: 0-9
size/S:
  - changes: 10-29
size/M:
  - changes: 30-99
size/L:
  - changes: 100-499
size/XL:
  - changes: 500-999
size/XXL:
  - changes: 1000+
