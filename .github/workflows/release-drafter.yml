name: Release Drafter

# Auto-drafts the GitHub Release notes from merged PRs, organized by label.
# https://github.com/release-drafter/release-drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish-date-format: YYYY-MM-DD
          tag-prefix: "v"
          version-resolver:
            major:
              labels: "breaking"
            minor:
              labels: "feature, enhancement"
            patch:
              labels: "bug, fix, docs, dependencies, perf, refactor, test, build, ci, chore, security"
            default: patch
          categories: |
            - title: 🚀 Features
              labels: ["feature", "enhancement"]
            - title: 🐛 Bug Fixes
              labels: ["bug", "fix"]
            - title: ⚡ Performance
              labels: ["perf", "performance"]
            - title: 🔒 Security
              labels: ["security"]
            - title: 📝 Documentation
              labels: ["docs", "documentation"]
            - title: 🔧 Maintenance
              labels: ["chore", "dependencies", "ci", "build", "refactor", "test"]
          exclude-labels: |
            - skip-changelog
            - duplicate
            - invalid
            - question
            - discussion
          change-template: "- $title (#$number) @$author"
          template: |
            ## Changes

            $CHANGES

            ---

            **Full Changelog**: https://github.com/Liuyifeidashuaibi/FnixAgent/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

            ## Contributors

            $CONTRIBUTORS

            _Auto-generated by [Release Drafter](https://github.com/release-drafter/release-drafter)._
