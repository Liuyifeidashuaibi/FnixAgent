name: Issue-PR Reference

# Closes issues automatically when a referenced PR is merged.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.body) return;

            // Match "Fixes #N", "Closes #N", "Resolves #N"
            const pattern = /(fix(?:es)?|closes?|resolves?)\s+#(\d+)/gi;
            const matches = [...pr.body.matchAll(pattern)];
            if (!matches.length) return;

            const issueNumbers = [...new Set(matches.map(m => Number(m[2])))];
            for (const issue_number of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                core.info(`✅ Closed #${issue_number}`);
              } catch (err) {
                core.warning(`⚠️ Could not close #${issue_number}: ${err.message}`);
              }
            }
