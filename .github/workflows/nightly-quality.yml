# Nightly quality gates — curated FCS validate + optional live agent runs
# Schedule: 04:00 UTC daily · also workflow_dispatch

name: Nightly Quality

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      live_fcs:
        description: "Run live curated FCS (needs API key secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: true

jobs:
  curated-validate:
    name: Curated FCS validate + Work golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.9 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Gate curated FCS (validate-only)
        run: node scripts/gate-curated-fcs.mjs

      - name: MCP trust unit tests
        run: python -m pytest tests/unit/test_mcp_trust.py -q

      - name: Beta metrics scaffold
        run: node scripts/beta-metrics.mjs

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-metrics
          path: reports/beta-metrics.json
          if-no-files-found: ignore

  curated-live:
    name: Curated FCS live (hard_pass ≥ 70%)
    runs-on: ubuntu-latest
    needs: [curated-validate]
    # Live only when explicitly requested or secret is present on schedule
    if: >
      github.event_name == 'workflow_dispatch' && inputs.live_fcs == true
      || (github.event_name == 'schedule' && vars.NIGHTLY_LIVE_FCS == '1')
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.9 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Start agentd
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FNIX_API_PORT: "8003"
        run: |
          if [ -z "${DASHSCOPE_API_KEY}${OPENAI_API_KEY}" ]; then
            echo "No LLM API key secret — skip live FCS"
            exit 0
          fi
          python -m fnixagent.main &
          echo $! > /tmp/agentd.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8003/health" >/dev/null; then
              echo "agentd ready"
              exit 0
            fi
            sleep 1
          done
          echo "agentd failed to become healthy"
          exit 1

      - name: Live curated FCS
        env:
          GATE_FCS_LIVE: "1"
          GATE_FCS_MIN_HARD_PASS: "70"
          VITE_API_BASE: "http://127.0.0.1:8003"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${DASHSCOPE_API_KEY}${OPENAI_API_KEY}" ]; then
            echo "No LLM API key — skip"
            exit 0
          fi
          node scripts/gate-curated-fcs.mjs

      - name: Beta metrics after live
        if: always()
        run: node scripts/beta-metrics.mjs --label nightly-live

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcs-nightly-reports
          path: |
            reports/**
          if-no-files-found: ignore

      - name: Stop agentd
        if: always()
        run: |
          if [ -f /tmp/agentd.pid ]; then kill "$(cat /tmp/agentd.pid)" || true; fi
