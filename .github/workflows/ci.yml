# fnixagent CI — 持续集成
# 触发: pull_request / push 到 main / develop
# 任务: 代码质量检查(ruff)+ 类型检查(pyright)+ 测试 + 安全扫描 + Docker 构建

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 代码质量检查:ruff(替代 black + flake8)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # 类型检查:pyright(strict 模式)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyright
        run: pip install pyright

      - name: Pyright type check
        run: pyright src/fnixagent/

  # ---------------------------------------------------------------------------
  # 单元测试 + 集成测试(矩阵:3.11 / 3.12 / 3.13)
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest-cov

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/unit/ -v --cov=src/fnixagent --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/integration/ -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ---------------------------------------------------------------------------
  # 安全扫描:bandit + pip-audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit static analysis
        run: bandit -r src/ -ll -f json -o bandit-report.json

      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ---------------------------------------------------------------------------
  # Shell 脚本检查:shellcheck
  # ---------------------------------------------------------------------------
  shellcheck:
    name: Shell Check (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: _references node_modules

  # ---------------------------------------------------------------------------
  # CHANGELOG 检查:PR 必须更新 CHANGELOG.md
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md is updated
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            changelog:
              - 'CHANGELOG.md'

      - name: Fail if CHANGELOG.md not updated
        if: steps.changes.outputs.changelog == 'false'
        run: |
          echo "::error::PR 未更新 CHANGELOG.md,请在 [Unreleased] 段添加变更说明"
          exit 1

  # ---------------------------------------------------------------------------
  # Desktop Tauri — typecheck + Rust compile
  # ---------------------------------------------------------------------------
  desktop-tauri:
    name: Workbench Tauri (typecheck + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.9 --activate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev,security]"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: python scripts/generate-app-icon.py

      - name: Tauri icons
        working-directory: apps/workbench
        run: pnpm exec tauri icon app-icon.png

      - name: Verify beta
        run: node scripts/verify-beta.mjs

  # ---------------------------------------------------------------------------
  # Docker 构建验证(不推送)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: fnixagent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # docker-compose 配置校验
  # ---------------------------------------------------------------------------
  compose-validate:
    name: Compose Config Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: Validate prod compose
        env:
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: test
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: test
          ES_PASSWORD: test
          JWT_SECRET_KEY: test
        run: docker compose -f deploy/docker/docker-compose.prod.yml config > /dev/null
