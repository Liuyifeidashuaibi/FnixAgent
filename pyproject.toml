# FnixAgent 项目元数据(Python Project Metadata, PEP 621)
# 构建后端:hatchling;依赖清单仍由 requirements.txt 维护(单一来源)
# Dockerfile 中 COPY pyproject.toml requirements.txt ./ 同时复制两份

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "fnixagent"
version = "1.1.0"
description = "FnixAgent — 智能办公助手，自进化 Agent(KTG + STP + MFP + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "FnixAgent Team" },
]
keywords = ["agent", "llm", "langgraph", "self-evolution", "ktg", "office"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# 动态依赖:从 requirements.txt 读取,避免重复维护
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
]
security = [
    "argon2-cffi>=23.1",          # Argon2id 密码哈希(Phase 0.4)
    "cryptography>=42.0",          # RSA-2048 密码传输加密 + AES-256-GCM 资产加密
]
# 云端文档智能(Azure Document Intelligence)
cloud = [
    "azure-ai-documentintelligence>=1.0.0",
]
# OCR 本地识别(PaddleOCR)
ocr = [
    "paddleocr>=2.7.0",
]
# 聚合全部可选依赖
all = [
    "fnixagent[security,cloud,ocr]",
]

[project.urls]
Homepage = "https://github.com/Liuyifeidashuaibi/FnixAgent"
Documentation = "https://github.com/Liuyifeidashuaibi/FnixAgent/blob/main/DEVELOPMENT.md"
Issues = "https://github.com/Liuyifeidashuaibi/FnixAgent/issues"

[project.scripts]
fnixagent = "fnixagent.main:main"

# 插件入口点:第三方 DocumentConverter 实现通过此入口点注册
[project.entry-points."fnixagent.converters"]
# 空占位 — 插件将通过此入口点注册 DocumentConverter 实现

# ---------------------------------------------------------------------------
# hatchling 构建配置
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/fnixagent"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fnixagent",
    "requirements.txt",
    "README.md",
    "LICENSE",
]

# 从 requirements.txt 动态读取依赖(通过 hatch-requirements-txt 插件)
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
requirements-file = "requirements.txt"

# ---------------------------------------------------------------------------
# 工具链配置:ruff(检查 + 格式化)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "_references",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM", "UP", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试中允许使用 assert 与部分可疑调用
"tests/*" = ["S101"]
"_references/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# 工具链配置:pyright(类型检查,strict 模式)
# ---------------------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src/fnixagent"]
exclude = [
    "_references",
    "tests",
    "build",
    "dist",
    "**/__pycache__",
]

# ---------------------------------------------------------------------------
# 工具链配置:pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: 标记慢测试(可加 --deselect 跳过)",
    "integration: 集成测试",
    "unit: 单元测试",
]

# ---------------------------------------------------------------------------
# 工具链配置:coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/fnixagent"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
