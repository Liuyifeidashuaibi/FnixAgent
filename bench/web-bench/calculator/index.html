<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background-color: #2c3e50;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        #display {
            width: 100%;
            height: 70px;
            font-size: 2.5rem;
            text-align: right;
            padding: 0 16px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            background-color: #34495e;
            color: white;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            font-size: 1.4rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #34495e;
            color: white;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .operator {
            background-color: #e67e22;
        }

        .equals {
            background-color: #27ae60;
        }

        .clear {
            background-color: #e74c3c;
        }

        .digit {
            background-color: #34495e;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 16px;
            }
            #display {
                height: 60px;
                font-size: 2rem;
            }
            button {
                height: 55px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <!-- Row 1: Operators -->
            <button class="operator" data-value="+">+</button>
            <button class="operator" data-value="-">-</button>
            <button class="operator" data-value="*">×</button>
            <button class="operator" data-value="/">÷</button>
            
            <!-- Row 2: Digits 7,8,9 and decimal -->
            <button class="digit" data-value="7">7</button>
            <button class="digit" data-value="8">8</button>
            <button class="digit" data-value="9">9</button>
            <button class="digit" data-value=".">.</button>
            
            <!-- Row 3: Digits 4,5,6, clear and sqrt -->
            <button class="digit" data-value="4">4</button>
            <button class="digit" data-value="5">5</button>
            <button class="digit" data-value="6">6</button>
            <button class="clear" data-value="clear">Clear</button>
            <button class="operator" data-value="sqrt">√</button>
            <button class="operator" data-value="square">^2</button>
            <button class="operator" data-value="reciprocal">1/x</button>
            
            <!-- Row 4: Digits 1,2,3 and equals -->
            <button class="digit" data-value="1">1</button>
            <button class="digit" data-value="2">2</button>
            <button class="digit" data-value="3">3</button>
            <button class="equals" data-value="=">=</button>
            
            <!-- Row 5: Digit 0 and operators -->
            <button class="digit" data-value="0" style="grid-column: span 2;">0</button>
            <button class="digit" data-value=".">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '';

        // Helper to safely evaluate expression
        function safeEvaluate(expr) {
            try {
                // Replace × and ÷ with * and /
                expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
                // Prevent unsafe operations
                if (/[^\d+\-*/().\s]/.test(expr)) {
                    return undefined;
                }
                // Avoid dangerous constructs
                if (expr.includes('eval') || expr.includes('function') || expr.includes('return')) {
                    return undefined;
                }
                const result = Function(`'use strict'; return (${expr})`)();
                return isFinite(result) ? result : undefined;
            } catch (e) {
                return undefined;
            }
        }

        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', () => {
                const value = button.getAttribute('data-value');

                if (value === 'clear') {
                    currentInput = '';
                    display.value = '';
                } else if (value === '=') {
                    if (!currentInput) return;
                    const result = safeEvaluate(currentInput);
                    display.value = result !== undefined ? String(result) : 'Error';
                    currentInput = display.value;
                } else if (value === 'square') {
                    if (!currentInput) return;
                    const num = safeEvaluate(currentInput);
                    if (num !== undefined) {
                        const result = num * num;
                        display.value = String(result);
                        currentInput = String(result);
                    } else {
                        display.value = 'Error';
                        currentInput = '';
                    }
                } else if (value === 'reciprocal') {
                    if (!currentInput) return;
                    const num = safeEvaluate(currentInput);
                    if (num !== undefined && num !== 0) {
                        const result = 1 / num;
                        display.value = String(result);
                        currentInput = String(result);
                    } else {
                        display.value = 'Error';
                        currentInput = '';
                    }
                } else {
                    currentInput += value;
                    display.value = currentInput;
                }
            });
        });

        // Keyboard support
        document.addEventListener('keydown', event => {
            const { key } = event;
            if (/^[0-9]$/i.test(key)) {
                event.preventDefault();
                currentInput += key;
                display.value = currentInput;
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                event.preventDefault();
                const op = key === '*' ? '×' : key === '/' ? '÷' : key;
                currentInput += op;
                display.value = currentInput;
            } else if (key === '.') {
                event.preventDefault();
                currentInput += '.';
                display.value = currentInput;
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                if (!currentInput) return;
                const result = safeEvaluate(currentInput);
                display.value = result !== undefined ? String(result) : 'Error';
                currentInput = display.value;
            } else if (key === 'Escape') {
                event.preventDefault();
                currentInput = '';
                display.value = '';
            }
        });
    </script>
</body>
</html>
