version: '3.8'

# FnixAgent — FSE 2027 Reproduction Orchestration
#
# Usage (run from this directory, i.e. paper/reproduction/):
#   docker compose build
#   docker compose run repro
#
# The `repro` service runs the no-LLM experiments (exp1 + exp4) by default and
# writes all result artifacts into the host-mounted results directory so they
# survive container exit. FNIX_MOCK_LLM=1 enables mock-mode placeholders for
# the LLM-dependent ablations (exp2/exp3); run `eval_mock.py` to emit them.

services:
  repro:
    build:
      # Build context is the repository root (one level up), so the Dockerfile
      # can COPY src/, paper/, benchmarks/, etc.
      context: ..
      dockerfile: paper/reproduction/Dockerfile
    image: fnixagent-repro:latest
    container_name: fnixagent-repro
    environment:
      FNIX_MOCK_LLM: "1"
      FNIX_API_ONLY: "1"
      FNIXAGENT_PROFILE: "standalone"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Persist experiment outputs to the host for reviewer inspection.
      - ../paper/experiments/results:/fnixagent/paper/experiments/results
    # Default one-shot run: exp1 (FCS scale-up) + exp4 (longitudinal self-evolution).
    # Both are pure-local and need no API key. Override with:
    #   docker compose run repro python paper/reproduction/eval_mock.py
    #   docker compose run repro python paper/experiments/run_all.py
    command: ["python", "paper/experiments/run_all.py", "--skip", "exp2", "exp3"]
